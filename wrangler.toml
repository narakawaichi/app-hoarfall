name = "achen-app-download-cache"
main = "_worker.js"
compatibility_date = "2025-09-14"

# Pages 部署时 wrangler.toml 被忽略，但本地 `wrangler dev` / `wrangler pages dev`
# 需要这个 assets 绑定才能提供静态文件，并让 _worker.js 里的 env.ASSETS 生效。
# directory 指向仓库根（index.html 所在目录）。
assets = { directory = "./", binding = "ASSETS", html_handling = "serve-index", not_found_handling = "404" }
